<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Finder</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

    <div class="container">
        <h1 class="heading">GitHub <span>Profile Finder</span></h1>

        <div class="searchBox">
            <input type="text" id="searchInput" placeholder="Enter GitHub username...">
            <button id="searchBtn" class="gradientBtn">
                <i class="bx bx-search"></i>
            </button>
        </div>

        <p id="errorMsg" class="errorMsg"></p>

        <div id="skeleton" class="skeleton hidden">
            <div class="skeletonAvatar"></div>
            <div class="skeletonLine"></div>
            <div class="skeletonLine short"></div>
        </div>

        <div id="profileContainer" class="profileCard hidden">
            <img id="avatar" src="" alt="profile picture" class="avatar">
            <h2 id="fullName" class="fullName"></h2>
            <p id="userName" class="userName"></p>
            <p id="bio" class="bio"></p>

            <div class="statsRow">
                <div class="statBox">
                    <i class="bx bx-folder"></i>
                    <h3 id="repoCount">0</h3>
                    <p>Repos</p>
                </div>
                <div class="statBox">
                    <i class="bx bx-group"></i>
                    <h3 id="followerCount">0</h3>
                    <p>Followers</p>
                </div>
                <div class="statBox">
                    <i class="bx bx-user-plus"></i>
                    <h3 id="followingCount">0</h3>
                    <p>Following</p>
                </div>
                <div class="statBox">
                    <i class="bx bx-calendar-check"></i>
                    <h3 id="activeDays">0</h3>
                    <p>Active Days</p>
                </div>
            </div>

            <div class="infoList">
                <p><i class="bx bx-map"></i> <span id="location">Not Available</span></p>
                <p><i class="bx bx-buildings"></i> <span id="company">Not Available</span></p>
                <p><i class="bx bx-link"></i> <a id="blogLink" href="#" target="_blank">Not Available</a></p>
                <p><i class="bx bx-calendar"></i> Joined on <span id="joinDate"></span></p>
            </div>

            <a id="profileLink" href="#" target="_blank" class="btn">View on GitHub</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
